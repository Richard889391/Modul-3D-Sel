<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D Interaktif Sel</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101d;color:white;font-family:Arial}header{padding:12px;text-align:center;background:#0b1524}h1{font-size:20px;margin:0 0 10px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{padding:10px 13px;border-radius:13px;border:1px solid #607895;background:#132238;color:#fff;font-weight:bold}button.active{background:#397fc4}#stage{position:relative;height:calc(100% - 92px)}canvas{width:100%;height:100%;display:block;touch-action:none}#info{display:none;position:absolute;right:10px;top:10px;width:min(290px,calc(100% - 20px));background:#0b1524ee;border:1px solid #65809d;border-radius:14px;padding:14px}#info h2{margin:0 25px 6px 0;font-size:18px}#info p{margin:0;line-height:1.45;font-size:14px}#x{position:absolute;right:5px;top:3px;border:0;background:none;font-size:22px}#hint{position:absolute;bottom:10px;left:10px;right:10px;padding:9px;background:#000b;border-radius:12px;text-align:center;font-size:13px}</style></head><body><header><h1>🔬 3D Interaktif Sel</h1><div class="toolbar"><button id="plant" class="active">🌿 Sel Tumbuhan</button><button id="animal">🐾 Sel Hewan</button><button id="reset">↻ Reset</button><button id="labels">🏷 Label</button></div></header><div id="stage"><div id="info"><button id="x">×</button><h2 id="it"></h2><p id="ip"></p></div><div id="hint">Geser untuk memutar • Cubit untuk zoom • Ketuk organel untuk informasi</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
(()=>{if(!window.THREE){alert('Three.js gagal dimuat. Periksa internet.');return}const S=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x07101d);const cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.z=12;const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));S.appendChild(r.domElement);scene.add(new THREE.AmbientLight(0xffffff,2));let l=new THREE.DirectionalLight(0xffffff,3);l.position.set(5,7,8);scene.add(l);let root=new THREE.Group();scene.add(root);let clickable=[],labs=[],mode='plant',rx=-.15,ry=.3,zoom=1,down=null,drag=false,lastX=0,lastY=0,show=true;const I=document.getElementById('info'),IT=document.getElementById('it'),IP=document.getElementById('ip');function M(c,o=1,t=false){return new THREE.MeshStandardMaterial({color:c,roughness:.5,transparent:t,opacity:o,side:THREE.DoubleSide})}function add(g,c,n,txt,p,sc){let m=new THREE.Mesh(g,M(c),);m.name=n;m.userData.info=txt;m.position.set(...p);if(sc)m.scale.set(...sc);root.add(m);clickable.push(m);return m}function sp(n,t,c,p,s){return add(new THREE.SphereGeometry(1,32,20),c,n,t,p,s)}function tor(n,t,c,p,R=.5){let m=add(new THREE.TorusGeometry(R,.07,12,32),c,n,t,p);m.rotation.x=Math.PI/2;return m}function lab(t,p){let c=document.createElement('canvas'),x=c.getContext('2d');c.width=420;c.height=80;x.fillStyle='#000b';x.roundRect(3,3,414,74,14);x.fill();x.font='bold 28px Arial';x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(t,210,40);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(2.5,.48,1);s.position.set(...p);scene.add(s);labs.push(s)}function clear(){root.clear();clickable=[];labs.forEach(x=>scene.remove(x));labs=[]}function plant(){clear();let wall=new THREE.Mesh(new THREE.SphereGeometry(4,48,32),M(0x55d47a,.22,true));wall.scale.set(1.45,1,.82);wall.name='Dinding sel';wall.userData.info='Dinding sel memberi bentuk, perlindungan, dan kekuatan pada sel tumbuhan.';root.add(wall);clickable.push(wall);let mem=new THREE.Mesh(new THREE.SphereGeometry(3.85,48,32),M(0x8cffb0,.13,true));mem.scale.set(1.45,1,.82);mem.name='Membran sel';mem.userData.info='Membran sel mengatur keluar-masuk zat.';root.add(mem);clickable.push(mem);sp('Vakuola','Vakuola menyimpan air dan membantu menjaga tekanan turgor.',0x75cfff,[-.2,.1,.1],[1.7,.72,.58]);sp('Inti sel','Inti menyimpan DNA dan mengatur aktivitas sel.',0xc45cff,[-.4,.1,1.1],[.9,.75,.75]);sp('Nukleolus','Nukleolus berperan dalam pembentukan ribosom.',0x7922a5,[-.4,.1,1.72],[.3,.28,.28]);[[1.8,1.1,.6],[1.8,-1,.7],[-1.8,1,.4],[-1.8,-1,.5],[.2,1.35,-.6],[.5,-1.35,-.5]].forEach(p=>sp('Kloroplas','Kloroplas mengandung klorofil dan menjadi tempat fotosintesis.',0x3ee06d,p,[.5,.28,.75]));[[1.2,.2,1.7],[-1.2,.4,1.5],[1,-.5,-1.5],[-1.3,-.4,-1.5]].forEach(p=>sp('Mitokondria','Mitokondria menghasilkan ATP melalui respirasi sel.',0xff704d,p,[.6,.3,.28]));for(let i=0;i<5;i++)tor('Badan Golgi','Badan Golgi memodifikasi dan mengemas protein.',0xffa54d,[-.2+i*.1,-1.05,1],.55);for(let i=0;i<18;i++){let a=i*.72;sp('Ribosom','Ribosom adalah tempat sintesis protein.',0xffffff,[1.8*Math.cos(a),.8*Math.sin(a),1.1*Math.sin(a*1.6)],[.07,.07,.07])}lab('Inti sel',[-.4,.9,2]);lab('Vakuola',[-.2,.9,.3]);lab('Kloroplas',[1.8,1.5,.6])}function animal(){clear();let mem=new THREE.Mesh(new THREE.SphereGeometry(3.8,48,32),M(0x6de39a,.16,true));mem.scale.set(1.35,1.05,.95);mem.name='Membran sel';mem.userData.info='Membran sel mengatur pertukaran zat dan menerima sinyal.';root.add(mem);clickable.push(mem);sp('Inti sel','Inti menyimpan DNA dan mengatur aktivitas sel.',0xc45cff,[-.3,.05,.4],[1.15,1,1]);sp('Nukleolus','Nukleolus membantu pembentukan komponen ribosom.',0x7922a5,[-.3,.05,1.1],[.35,.3,.3]);[[1.4,1,.5],[1.5,-.9,.6],[-1.4,1.1,.1],[-1.5,-1,.4],[.5,-.1,-1.6],[-.5,1.3,-1]].forEach(p=>sp('Mitokondria','Mitokondria menghasilkan ATP melalui respirasi sel.',0xff704d,p,[.6,.3,.28]));for(let i=0;i<5;i++)tor('Badan Golgi','Badan Golgi memodifikasi dan mengemas protein.',0xffa54d,[-.8+i*.1,-1.2,.7],.55);[[1.1,.2,1.8],[-1.5,.3,1.4],[1,-1.2,-.2],[-1.1,-1.3,-.8]].forEach(p=>sp('Lisosom','Lisosom membantu memecah bahan yang tidak diperlukan sel.',0xffd34d,p,[.25,.25,.25]));for(let i=0;i<22;i++){let a=i*.63;sp('Ribosom','Ribosom adalah tempat sintesis protein.',0xffffff,[2*Math.cos(a),1.2*Math.sin(a),.7*Math.sin(2*a)],[.07,.07,.07])}lab('Inti sel',[-.3,.9,1.8]);lab('Mitokondria',[1.4,1.5,.6]);lab('Lisosom',[1.1,.6,1.8])}function build(){mode==='plant'?plant():animal();rx=-.15;ry=.3;zoom=1}function resize(){let w=S.clientWidth,h=S.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();document.getElementById('plant').onclick=()=>{mode='plant';plantBtn(true);build()};document.getElementById('animal').onclick=()=>{mode='animal';plantBtn(false);build()};function plantBtn(p){document.getElementById('plant').classList.toggle('active',p);document.getElementById('animal').classList.toggle('active',!p)}document.getElementById('reset').onclick=()=>{rx=-.15;ry=.3;zoom=1};document.getElementById('labels').onclick=()=>{show=!show;labs.forEach(x=>x.visible=show)};document.getElementById('x').onclick=()=>I.style.display='none';r.domElement.onpointerdown=e=>{drag=true;down=[e.clientX,e.clientY];lastX=e.clientX;lastY=e.clientY};r.domElement.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lastX)*.008;rx+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY};r.domElement.onpointerup=e=>{drag=false;if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>10)return;let q=r.domElement.getBoundingClientRect(),p=new THREE.Vector2((e.clientX-q.left)/q.width*2-1,-((e.clientY-q.top)/q.height)*2+1),rc=new THREE.Raycaster();rc.setFromCamera(p,cam);let h=rc.intersectObjects(clickable,true)[0];if(h){IT.textContent=h.object.name;IP.textContent=h.object.userData.info||'';I.style.display='block'}};r.domElement.onwheel=e=>{e.preventDefault();zoom*=e.deltaY>0?.92:1.08;zoom=Math.max(.65,Math.min(1.8,zoom))};build();function loop(){requestAnimationFrame(loop);root.rotation.x=rx;root.rotation.y=ry;root.scale.setScalar(zoom);r.render(scene,cam)}loop()})();</script></body></html>
