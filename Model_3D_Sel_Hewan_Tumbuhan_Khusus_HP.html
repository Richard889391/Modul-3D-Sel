<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Model 3D Interaktif Sel</title>
<style>
html,body,#scene{width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
body{overflow:hidden}
@media (max-width:600px){
 #top{padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
 h1{font-size:16px;margin-bottom:6px}
 .btn{font-size:12px;padding:9px 10px;margin:2px 1px}
 .hint{font-size:10px;line-height:1.25}
 #info{left:10px;right:10px;top:auto;bottom:62px;width:auto;max-width:none;padding:11px}
 #info h2{font-size:16px;margin-bottom:5px}
 #info p{font-size:13px}
 #legend{left:8px;right:8px;bottom:8px;text-align:center;font-size:10px}
}

*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#101923;color:#fff}
#top{position:fixed;z-index:10;top:0;left:0;right:0;background:rgba(10,18,28,.94);padding:12px;text-align:center}
h1{font-size:20px;margin:0 0 8px}.btn{border:0;border-radius:8px;padding:9px 14px;margin:2px;background:#2878ed;color:#fff;font-weight:bold}
#scene{position:fixed;inset:0}.hint{font-size:12px;color:#cbd6e0;margin-top:4px}
#info{position:fixed;z-index:8;right:16px;top:115px;width:310px;max-width:calc(100% - 32px);background:rgba(8,17,27,.95);border:1px solid #48657d;border-radius:12px;padding:14px;display:none;box-shadow:0 10px 30px #0008}
#info h2{font-size:18px;margin:0 0 7px;color:#7dc3ff}#info p{font-size:14px;line-height:1.45;margin:0}
#legend{position:fixed;z-index:7;bottom:14px;left:14px;background:#0009;padding:9px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="top">
<h1>🧬 Model 3D Interaktif: Sel Hewan & Sel Tumbuhan</h1>
<button class="btn" onclick="build('animal')">Sel Hewan</button>
<button class="btn" onclick="build('plant')">Sel Tumbuhan</button>
<button class="btn" onclick="toggleRotate()">⏯ Rotasi</button>
<div class="hint">🖱️ Seret untuk memutar • Klik organel untuk melihat informasi</div>
</div>
<div id="scene"></div>
<div id="info"><h2 id="ititle"></h2><p id="idesc"></p></div>
<div id="legend">Klik bagian berwarna pada sel untuk mempelajari fungsi organel.</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,root,raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let clickable=[],auto=true,down=false,lastX=0,lastY=0;

const data={
"Membran Sel":["Membran Sel","Melindungi sel dan mengatur zat yang masuk serta keluar dari sel."],
"Sitoplasma":["Sitoplasma","Cairan di dalam sel yang menjadi tempat organel berada dan berbagai reaksi kimia berlangsung."],
"Inti Sel":["Inti Sel (Nukleus)","Pusat pengendalian aktivitas sel dan tempat penyimpanan materi genetik atau DNA."],
"Mitokondria":["Mitokondria","Menghasilkan energi dalam bentuk ATP melalui proses respirasi sel."],
"Ribosom":["Ribosom","Tempat berlangsungnya sintesis atau pembuatan protein."],
"Retikulum Endoplasma":["Retikulum Endoplasma","Membantu sintesis dan transportasi protein serta lipid di dalam sel."],
"Badan Golgi":["Badan Golgi","Memodifikasi, mengemas, dan menyalurkan protein atau zat lainnya."],
"Lisosom":["Lisosom","Mengandung enzim yang membantu memecah dan mendaur ulang zat di dalam sel."],
"Sentriol":["Sentriol","Berperan terutama dalam pengorganisasian mikrotubulus dan proses pembelahan sel hewan."],
"Dinding Sel":["Dinding Sel","Lapisan kuat yang memberi bentuk, kekuatan, dan perlindungan pada sel tumbuhan."],
"Kloroplas":["Kloroplas","Organel yang mengandung klorofil dan menjadi tempat berlangsungnya fotosintesis."],
"Vakuola":["Vakuola Sentral","Ruang penyimpanan besar pada sel tumbuhan yang membantu menyimpan air dan zat terlarut serta menjaga tekanan turgor."]
};

function mat(c,op=1){return new THREE.MeshStandardMaterial({color:c,roughness:.55,transparent:op<1,opacity:op,side:THREE.DoubleSide})}
function obj(name,geo,material,pos,scale=[1,1,1]){
 let m=new THREE.Mesh(geo,material);m.position.set(...pos);m.scale.set(...scale);m.userData.name=name;root.add(m);clickable.push(m);return m;
}
function sphere(name,c,pos,scale){return obj(name,new THREE.SphereGeometry(1,32,20),mat(c),pos,scale)}
function setup(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x101923);
 camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,9);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
 document.getElementById("scene").appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x314352,2.4));
 let d=new THREE.DirectionalLight(0xffffff,2.4);d.position.set(4,7,6);scene.add(d);
 renderer.domElement.addEventListener("pointerdown",e=>{down=true;lastX=e.clientX;lastY=e.clientY});
 addEventListener("pointerup",()=>down=false);
 addEventListener("pointermove",e=>{if(!down||!root)return;root.rotation.y+=(e.clientX-lastX)*.008;root.rotation.x+=(e.clientY-lastY)*.006;lastX=e.clientX;lastY=e.clientY});
 renderer.domElement.addEventListener("click",click);
 addEventListener("resize",resize);resize();
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function click(e){
 const r=renderer.domElement.getBoundingClientRect();
 mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(clickable,true);
 if(hits.length){let n=hits[0].object.userData.name;if(data[n])showInfo(...data[n])}
}
function showInfo(title,desc){document.getElementById("info").style.display="block";document.getElementById("ititle").textContent=title;document.getElementById("idesc").textContent=desc}
function clear(){if(root)scene.remove(root);clickable=[]}
function base(){
 // small ribosomes
 for(let i=0;i<16;i++)sphere("Ribosom",0x263238,[(Math.random()-.5)*4,(Math.random()-.5)*2.5,(Math.random()-.5)*1.8],[.045,.045,.045]);
 // ER
 for(let i=0;i<4;i++)sphere("Retikulum Endoplasma",0x3478c4,[-.8+i*.2,.35,.9],[.14,.55,.13]);
 // nucleus
 sphere("Inti Sel",0x9c6bea,[0,.25,.25],[.82,.72,.72]);
 sphere("Inti Sel",0x5d329e,[.05,.3,.87],[.27,.27,.27]);
 // mitochondria
 for(const p of [[1.3,.7,.6],[1.15,-.85,.4]]){
  sphere("Mitokondria",0xe45d4d,p,[.5,.28,.23]);
  let t=obj("Mitokondria",new THREE.TorusGeometry(.15,.035,8,24),mat(0x5b1715),[p[0],p[1],p[2]+.19],[1,1,1]);t.rotation.x=Math.PI/2;
 }
 // golgi
 for(let i=-2;i<=2;i++){let t=obj("Badan Golgi",new THREE.TorusGeometry(.43,.07,10,32,Math.PI*1.4),mat(0xff934b),[-1.3+i*.06,-.55+i*.06,.65]);t.rotation.x=Math.PI/2}
}
function animal(){
 sphere("Sitoplasma",0x5db8e8,[0,0,0],[3.1,2.05,2.15]);
 obj("Membran Sel",new THREE.SphereGeometry(1,48,32),mat(0x1477b9,.28),[0,0,0],[3.2,2.15,2.25]);
 base();
 sphere("Lisosom",0xf0c53d,[1,-.15,.8],[.16,.16,.16]);sphere("Lisosom",0xf0c53d,[-1.5,.5,.75],[.14,.14,.14]);
 for(let i=0;i<2;i++){let c=obj("Sentriol",new THREE.CylinderGeometry(.12,.12,.65,16),mat(0xf0a500),[.25+i*.3,-.7,.65]);c.rotation.z=Math.PI/2}
}
function plant(){
 obj("Dinding Sel",new THREE.BoxGeometry(6.2,4.4,4.1),mat(0x38a85a,.30),[0,0,0]);
 obj("Membran Sel",new THREE.BoxGeometry(5.65,3.85,3.55),mat(0xf2c35c,.18),[0,0,0]);
 sphere("Sitoplasma",0xd4c78b,[0,0,0],[2.7,1.9,1.75]);
 sphere("Vakuola",0x6cb7e8,[.55,.05,-.05],[1.25,1.48,1.05]);
 base();
 for(const p of [[1.35,.15,.9],[.2,1.25,.75],[-.55,-1.3,.85]]){
  sphere("Kloroplas",0x39a94b,p,[.52,.25,.22]);
  for(let i=-1;i<=1;i++)sphere("Kloroplas",0x176d35,[p[0]+i*.15,p[1],p[2]+.17],[.07,.17,.27]);
 }
}
function build(t){clear();root=new THREE.Group();scene.add(root);t==="animal"?animal():plant();root.rotation.set(-.12,.35,0);document.getElementById("info").style.display="none"}
function toggleRotate(){auto=!auto}
function animate(){requestAnimationFrame(animate);if(root&&auto)root.rotation.y+=.003;renderer.render(scene,camera)}
setup();build("animal");animate();
</script>
</body>
</html>
